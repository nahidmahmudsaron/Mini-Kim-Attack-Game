<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Mini Zombie Attack Game</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div class="game-container">

        <h1>🧟 Mini Kim Attack</h1>

        <p class="subtitle">
            Click the zombies before they disappear!
        </p>


        <!-- Game Info -->

        <div class="info">

            <div>
                🎯 Score:
                <strong id="score">0</strong>
            </div>

            <div>
                ⏱️ Time:
                <strong id="time">20</strong>
            </div>

        </div>


        <!-- Game Area -->

        <div id="gameArea">

            <!-- Zombies will appear here -->

        </div>


        <!-- Start Button -->

        <button id="startBtn">
            ▶ Start Game
        </button>


        <!-- Message -->

        <h2 id="message"></h2>


        <!-- Developer Credit -->

        <div class="developer-credit">

            <span>DEVELOPED BY</span>

            <strong>Nahid Mahmud Saron</strong>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
